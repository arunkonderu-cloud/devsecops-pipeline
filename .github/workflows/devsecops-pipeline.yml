name: DevSecOps Security Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  secret-scan:
    name: Gate 1 - Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  iac-security-scan:
    name: Gate 2 - IaC Security Scan
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: true

  container-security-scan:
    name: Gate 3 - Container CVE Scan
    runs-on: ubuntu-latest
    needs: iac-security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: |
          printf 'FROM alpine:3.22\nRUN adduser -D appuser\nUSER appuser\n' > Dockerfile
          docker build -t devsecops-app:${{ github.sha }} .
      - name: Fail on fixable HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: cyclonedx
          output: sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90
  kubernetes-security-validation:
    name: Gate 4 - Kubernetes Security Validation
    runs-on: ubuntu-latest
    needs: container-security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Verify default-deny NetworkPolicy
        run: test -f kubernetes/network-policies/default-deny.yaml && echo "Present" || exit 1
      - name: Check no cluster-admin bindings
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = []
          for path in glob.glob("kubernetes/**/*.y*ml", recursive=True):
              with open(path) as f:
                  for doc in yaml.safe_load_all(f):
                      if not isinstance(doc, dict):
                          continue
                      if doc.get("kind") in ("ClusterRoleBinding", "RoleBinding") and (doc.get("roleRef") or {}).get("name") == "cluster-admin":
                          bad.append(f'{path}: {doc["kind"]} {(doc.get("metadata") or {}).get("name")}')
          if bad:
              print("cluster-admin bindings detected:"); print("\n".join(bad)); sys.exit(1)
          print("RBAC clean: no bindings to cluster-admin")
          EOF
  audit-trail:
    name: Gate 5 - Audit Trail
    runs-on: ubuntu-latest
    needs: [secret-scan, iac-security-scan, container-security-scan, kubernetes-security-validation]
    if: success()
    steps:
      - name: Generate attestation
        run: |
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"commit\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\",\"run_id\":\"${{ github.run_id }}\",\"gates_passed\":true}" > attestation.json
          cat attestation.json
      - uses: actions/upload-artifact@v4
        with:
          name: attestation-${{ github.sha }}
          path: attestation.json
          retention-days: 365
